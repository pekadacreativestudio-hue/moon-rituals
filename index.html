<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon Rituals - Aloko Udapadi</title>
    
    <!-- Core Libraries with Mobile & Desktop stability -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --c-navy: #0D4B63;
            --c-sand: #E5E1DD;
        }

        html, body, #root {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #051921;
        }

        body {
            /* 15% Lightened background */
            background: radial-gradient(circle at center, #104C66 0%, #051921 100%);
            background-attachment: fixed;
            color: #E5E1DD;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        body.modal-open { overflow: hidden; position: fixed; width: 100%; }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .sinhala-text { font-family: 'Abhaya Libre', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Heading Forced to 2 lines for Desktop & Mobile */
        .forced-two-lines {
            display: block;
            line-height: 0.85;
            text-align: center;
        }

        .title-gold-gradient {
            background: linear-gradient(to right, #B8860B 0%, #D4AF37 25%, #FFEE8C 50%, #D4AF37 75%, #B8860B 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineGold 8s linear infinite;
        }

        .poya-gold-gradient {
            background: linear-gradient(to right, #5C4033 0%, #8B6D3B 25%, #B8860B 50%, #8B6D3B 75%, #5C4033 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineGold 6s linear infinite;
            display: inline-block;
        }

        @keyframes shineGold { to { background-position: 200% center; } }

        .live-ivory-bg {
            background: linear-gradient(-45deg, #FFFFF0, #FFFFFF, #F8F4E3, #FFFFF0);
            background-size: 300% 300%;
            animation: ivoryFlow 8s ease-in-out infinite;
            box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.5);
        }

        @keyframes ivoryFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            25% { opacity: 0.5; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        .particle { position: fixed; background: white; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(1px); }

        @keyframes moonLive {
            0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)) drop-shadow(0 0 10px rgba(255, 238, 140, 0.3)); }
            50% { transform: scale(1.1) translateY(-15px); filter: drop-shadow(0 20px 20px rgba(0,0,0,0.2)) drop-shadow(0 15px 25px rgba(255, 238, 140, 0.5)); }
        }
        .live-moon-anim { animation: moonLive 4s ease-in-out infinite; }
        @keyframes rotateGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            opacity: 0;
        }
        .accordion-expanded {
            max-height: 4000px;
            opacity: 1;
        }

        .fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #loader-css {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #051921; z-index: 9999;
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.9) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-pop { animation: modalPop 0.5s cubic-bezier(0.2, 1, 0.3, 1) forwards; }
    </style>
</head>
<body>
    <div id="root">
        <div id="loader-css">
            <div style="width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.1); border-top-color: #D4AF37; border-radius: 50%; animation: rotateGlow 1s linear infinite;"></div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useMemo } = React;

        const theme = {
            deepNavy: '#051921',
            navy: '#104C66',
            darkGold: '#5C4033',     
            copper: '#915F33',       
            moonYellow: '#FFEE8C',   
            brightGold: '#D4AF37',   
        };

        const MovingParticles = () => {
            const particles = useMemo(() => Array.from({ length: 25 }).map((_, i) => ({
                id: i, size: Math.random() * 2 + 1, left: `${Math.random() * 100}%`, bottom: `-${Math.random() * 50}%`,
                duration: Math.random() * 20 + 10, delay: Math.random() * 10
            })), []);
            return (
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                    {particles.map(p => (
                        <div key={p.id} className="particle" style={{
                            width: `${p.size}px`, height: `${p.size}px`, left: p.left, bottom: p.bottom,
                            animation: `floatParticle ${p.duration}s linear infinite`, animationDelay: `${p.delay}s`
                        }} />
                    ))}
                </div>
            );
        };

        const MoonCraters = ({ color, opacity }) => (
            <React.Fragment>
                <circle cx="35" cy="35" r="7" fill={color} opacity={opacity} />
                <circle cx="65" cy="55" r="10" fill={color} opacity={opacity} />
                <circle cx="45" cy="70" r="5" fill={color} opacity={opacity} />
                <circle cx="25" cy="60" r="4" fill={color} opacity={opacity} />
                <circle cx="70" cy="30" r="4.5" fill={color} opacity={opacity} />
            </React.Fragment>
        );

        const MoonBase = ({ children, className, hasLitSide, isSmall = false }) => (
            <div className="relative flex flex-col items-center">
                <div className={`${isSmall ? 'w-12 h-12' : 'w-16 h-16 md:w-20 md:h-20'} relative rounded-full transition-all duration-700 live-moon-anim ${className}`}>
                    <svg viewBox="0 0 100 100" className="w-full h-full">
                        <circle cx="50" cy="50" r="48" fill="#104C66" />
                        
                        {/* Light craters for dark side */}
                        <MoonCraters color="white" opacity="0.08" />
                        
                        {/* Moon phases lit portions */}
                        {children}
                        
                        {/* Dark craters for light side / full moon */}
                        {children && <MoonCraters color="#021017" opacity="0.12" />}
                        
                        {hasLitSide && <circle cx="50" cy="50" r="48" fill={theme.darkGold} opacity="0.1" />}
                        <circle cx="50" cy="50" r="49" fill="none" stroke={theme.moonYellow} strokeWidth="0.5" opacity="0.4" />
                    </svg>
                </div>
                <div className={`${isSmall ? 'w-8 h-1' : 'w-12 h-2'} bg-[#021017] rounded-[100%] blur-[4px] opacity-20 mt-2`}></div>
            </div>
        );

        const SandglassIcon = () => (
            <svg className="w-3.5 h-3.5 md:w-4 md:h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <path d="M6 2H18M6 22H18M7 2V6.5C7 8.5 8.5 10 10.5 10.5L13.5 11.5C15.5 12 17 13.5 17 15.5V22M17 2V6.5C17 8.5 15.5 10 13.5 10.5L10.5 11.5C8.5 12 7 13.5 7 15.5V22" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
        );

        const PoyaCategoryCard = ({ title, icon: Icon, occurrences, isExpanded, onToggle }) => (
            <div className="w-full flex justify-center px-4 z-10 relative my-4">
                <div onClick={onToggle} className="w-full max-w-lg rounded-[2.2rem] p-[2.5px] relative overflow-hidden cursor-pointer shadow-2xl transition-transform active:scale-[0.98]">
                    <div className="absolute inset-[-100%] z-0" style={{ background: `conic-gradient(from 0deg, transparent 0%, ${theme.brightGold} 10%, ${theme.moonYellow} 15%, ${theme.brightGold} 20%, transparent 30%, transparent 50%, ${theme.brightGold} 60%, ${theme.moonYellow} 65%, ${theme.brightGold} 70%, transparent 80%)`, animation: 'rotateGlow 10s linear infinite', opacity: 0.95 }} />
                    <div className="relative z-10 w-full rounded-[2.1rem] live-ivory-bg overflow-hidden flex flex-col">
                        <div className="p-7 md:p-8 flex items-center space-x-6">
                            <div className="flex-shrink-0"><Icon /></div>
                            <div className="flex-grow">
                                <h2 className="text-3xl md:text-4xl tracking-tight sinhala-text font-extrabold leading-tight"><span className="poya-gold-gradient">{title}</span></h2>
                                <p className="sinhala-text text-sm text-[#083A4F] opacity-60">වසරේ සියලු පෝය දින බැලීමට ක්ලික් කරන්න</p>
                            </div>
                        </div>
                        <div className={`accordion-content ${isExpanded ? 'accordion-expanded' : ''}`}>
                            <div className="px-5 pb-8 space-y-2">
                                <div className="h-px bg-black/10 w-full mb-3 mx-2"></div>
                                {occurrences.map((item, idx) => (
                                    <div key={item.sinhalaDate + idx} className="flex flex-col py-3 px-6 rounded-2xl bg-white/40 border border-black/5 silk-transition hover:bg-white/60">
                                        <span className="sinhala-text text-[20px] md:text-[22px] font-bold leading-tight mb-0.5" style={{ color: theme.copper }}>{item.year} {item.monthName} මස {title}</span>
                                        <span className="sinhala-text text-base md:text-lg font-bold text-[#083A4F] leading-tight mb-0.5">{item.sinhalaDate}</span>
                                        <div className="flex items-center space-x-1.5 text-[#083A4F] font-bold"><SandglassIcon /><span className="sinhala-text text-base md:text-lg">{item.time}</span></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [appState, setAppState] = useState('intro'); 
            const [viewMode, setViewMode] = useState('month');
            const [selectedMonth, setSelectedMonth] = useState(0);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [poyaModal, setPoyaModal] = useState({ isOpen: false, data: null });
            const [expandedPoyaType, setExpandedPoyaType] = useState(null);

            const sinhalaMonths = [
                { id: 0, name: "වෙසක්", year: "2026", en: "MAY", desc: "ගෞතම බුදුරජුන්ගේ ලොව පහළවීම, සම්බුද්ධත්වයට පත්වීම හා පිරිනිවන්පෑම යන උතුම් තෙමඟුල සිදූවූයේ වෙසක් පුන් පොහෝ දිනයන්හිදී ය.\n\nසම්බුද්ධත්වයෙන් වසර අටක් ගත වූ තැන බුදුරජාණන් වහන්සේ තුන්වන වරට ලංකාද්වීපයේ කැළණියට වැඩම කොට වදාළේ වෙසක් පුන් පොහෝ දිනක ය.\n\nබුදුරජාණන් වහන්සේ සම්බුද්ධත්වයට පත්ව ප‍්‍රථම වරට කිඹුල්වත්පුරයට වැඩම කොට යමා මහ පෙළහර පා වදාළේ වෙසක් පුන් පොහෝ දිනක ය.\n\nආනන්ද මහරහතන් වහන්සේගේ පිරිනිවන්පෑම සිදූවූයේ ද වෙසක් පුන් පොහෝ දිනක ය." },
                { id: 1, name: "පොසොන්", year: "2026", desc: "අනුබුදු මිහිඳු මහරහතන් වහන්සේ ගෞතම බුදුරජුන්ගේ ධර්ම දායාදය රැගෙන ලක්දිවට වැඩම කොට වදාළේ පොසොන් පුන් පොහෝ දිනක ය." },
                { id: 2, name: "ඇසල", year: "2026", desc: "වහන්සේ මහාමායා බිසවුන් කුස පිළිසිඳ ගත්තේ ඇසළ පුන් පොහෝ දිනක ය.\n\nගිහිගෙය පිළිබඳව කළකිරුන සිද්ධාර්ථ කුමරුන් විමුක්තිය පතා මහභිනික්මන් කළේ ඇසළ පුන් පොහෝ දිනකය.\n\nරාහුල කුමරුන්ගේ උපත ද ඇසළ පුන් පොහෝ දිනක සිදුවිය.\n\nසම්මා සම්බුද්ධත්වයට පත් වී වදාළ බුදුරජාණන් වහන්සේ බරණැස ඉසිපතන මිගදායේ දී දස දහසක් ලෝකධාතූන් කම්පා කරවමින් ප‍්‍රථම දම් දෙසුම පවත්වා වදාළේ ඇසළ පුන් පොහෝ දිනක ය." },
                { id: 3, name: "නිකිනි", year: "2026", desc: "ප්‍රථම ධර්ම සංගායනාව පැවැත්වීම ආරම්භ කරන ලද්දේ නිකිණි පුන් පොහෝ දිනක ය.\n\nආනන්ද ස්වාමීන් වහන්සේ උතුම් අරහත්වයට පත්වී වදාළේ නිකිණි පුන් පොහෝ දිනක ය." },
                { id: 4, name: "බිනර", year: "2026", desc: "ගෞතම බුදුරජුන්ගේ ශ්‍රාවක වූ භික්‍ෂූනී සංඝයාගේ ආරම්භය සිදූවූයේ බිනර පුන්පොහෝ දිනක ය." },
                { id: 5, name: "වප්", year: "2026", desc: "බුදුරජාණන් වහන්සේ තවුතිසා දෙව්ලොවින් දඹදිව සංකස්ස පුරයට වැඩමකොට මහා පෙලහර පෑවේ වප් පුන් පොහෝ දිනක ය.\n\nසාරිපුත්ත මහ රහතන් වහන්සේ මහා ප්‍රඥාවන්ත භික්‍ෂූන් අතර අගතනතුර ලැබුවේ වප් පුන් පොහෝ දිනක ය.\n\nස්වාමීන් වහන්සේලාගේ පෙරවස් පවාරන දිනය වන්නේ වප් පුන් පොහෝ දිනය යි." },
                { id: 6, name: "ඉල්", year: "2026", desc: "ප්‍රථම ධර්ම දූත පිරිස වන රහතන් වහන්සේලා සැටනම ධර්ම ප්‍රචාරය සඳහා වැඩම කොට වදාළේ ඉල් පුන් පොහෝ දිනක ය.\n\nසාරිපුත්ත මහරහතන් වහන්සේගේ පිරිනිවන් පෑම සිදූවූයේ ඉල් පුන් පොහෝ දිනක ය.\n\nස්වාමීන් වහන්සේලාගේ පසුවස් පවාරණ දිනය වන්නේ ඉල් පුන් පොහෝ දිනය යි." },
                { id: 7, name: "උඳුවප්", year: "2026", desc: "සංඝමිත්තා මහරහත් තෙරණිය විසින් ජය ශ‍්‍රී මහා බෝධීන් වහන්සේගේ දක්‍ෂිණ ශාඛාව ලක්දිවට වැඩමවන ලද්දේ උඳුවප් පුන් පොහෝ දිනක ය." },
                { id: 8, name: "දුරුතු", year: "2027", desc: "ගෞතම බුදුරජුන්ගේ ප්‍රථම ලංකාගමනය සිදූවූයේ ශ්‍රී සම්බුද්ධත්වයෙන් මාස නවයක් ගතවූ තැන එළැඹි දුරුතු පුන්පොහෝ දින ය.\n\nසුමන සමන් දෙව් රජුන්ගේ ඉල්ලීමකට අනුව බුදුරජාණන් වහන්සේ විසින් ලබාදුන් කේශ ධාතු තැන්පත් කරවමින් මහියංගණ චෛත්‍ය රාජයාණන් වහන්සේ ඉදිකරණු ලැබුවේ ද එම දුරුතු පුන් පොහෝ දා ය. මහියංගණ චෛත්‍ය රාජයාණන් වහන්සේ තුළ පසු කලෙක සර්වඥ ග්‍රීවා ධාතූන් වහන්සේ ද තැන්පත් කරනු ලැබීය." },

                { id: 10, name: "මැදින්", year: "2027", desc: "බුදුරජාණන් වහන්සේ විසි දහසක් මහරහතන් වහන්සේලා සමඟින් රජගහ නුවරින් නික්ම කිඹුල්වත් නුවරට වැඩම කිරීම ආරම්භ කරන ලද්දේ මැදින් පුන් පොහෝ දිනක දී ය." },

                        <button onClick={() => setAppState('main')} className="px-12 py-4 rounded-full bg-[#083A4F] text-[#D4AF37] sinhala-text text-2xl font-bold border border-[#D4AF37]/30 shadow-lg active:scale-95 transition-transform">පිවිසෙන්න</button>

                                                <div className="flex flex-col items-start space-y-3 mt-2">
                                                    <div className="relative inline-block w-fit">
                                                        <div className="flex items-center space-x-1.5 relative z-10 px-3 py-1.5 md:px-4 md:py-2 text-white font-bold">
                                                            <SandglassIcon /><span className="sinhala-text text-lg">{i === 0 || i === 3 ? "පූර්ව භාග 06:42" : "අපර භාග 08:15"}</span>
                                                        </div>
                                                        <div style={{ backgroundColor: '#083A4F' }} className="absolute inset-0 rounded-xl z-0"></div>
                                                    </div>
                                                    
                                                    {p.desc && (
                                                        <button 
                                                            onClick={() => setPoyaModal({ isOpen: true, data: { monthName: sinhalaMonths[selectedMonth].name, description: p.desc } })} 
                                                            className="sinhala-text text-base text-[#407E8C] underline font-bold hover:text-[#083A4F] transition-colors"
                                                        >
                                                            පොහොය විස්තරය
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    ) : (
                        <div className="w-full max-w-5xl px-4 flex flex-col items-center">
                            {poyaCategories.map(cat => (
                                <PoyaCategoryCard key={cat.id} title={cat.title} icon={cat.icon} isExpanded={expandedPoyaType === cat.id} onToggle={() => setExpandedPoyaType(expandedPoyaType === cat.id ? null : cat.id)} occurrences={getPoyaData(cat.id)} />
                            ))}
                        </div>
                    )}

                    {/* Modals */}
                    {poyaModal.isOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/90 backdrop-blur-md" onClick={() => setPoyaModal({ isOpen: false, data: null })}>
                            <div className="relative w-full max-w-md bg-[#FDFBF7] border border-white/10 rounded-[2.5rem] shadow-2xl p-8 max-h-[85vh] overflow-y-auto no-scrollbar animate-modal-pop" onClick={e => e.stopPropagation()}>
                                <h3 className="sinhala-text text-3xl font-bold poya-gold-gradient mb-4 leading-tight">{poyaModal.data?.monthName} මස පොහොය විස්තරය</h3>
                                <p className="sinhala-text text-xl text-[#083A4F] leading-[1.4] text-justify whitespace-pre-line mb-10 px-1">{poyaModal.data?.description}</p>
                                <button onClick={() => setPoyaModal({ isOpen: false, data: null })} className="w-full py-4 bg-[#083A4F] text-white rounded-2xl sinhala-text text-xl font-bold shadow-lg active:scale-95 transition-transform">පෙර මෙනුවට</button>
                            </div>
                        </div>
                    )}

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/90 backdrop-blur-md" onClick={() => setIsModalOpen(false)}>
                            <div className="w-full max-w-xs bg-[#0A2330] rounded-3xl p-6 border border-white/10 max-h-[75vh] overflow-y-auto no-scrollbar" onClick={e => e.stopPropagation()}>
                                <h3 className="sinhala-text text-2xl font-bold text-white mb-6 text-center opacity-80">මාසය තෝරන්න</h3>
                                {sinhalaMonths.map(m => (
                                    <button key={m.id} onClick={() => { setSelectedMonth(m.id); setIsModalOpen(false); }} className={`w-full py-4 mb-2 rounded-2xl sinhala-text text-xl transition-all ${selectedMonth === m.id ? 'bg-[#FFEE8C] text-[#021017] font-bold' : 'bg-white/5 text-white/70 hover:bg-white/10'}`}>{m.name} මස</button>
                                ))}
                            </div>
                        </div>
                    )}
                    <footer className="z-10 mt-10 mb-6 opacity-30 text-[10px] tracking-widest uppercase text-white serif">© Aloko Udapadi</footer>
                </main>
            );
        }

        window.addEventListener('load', function() {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>
</html>
