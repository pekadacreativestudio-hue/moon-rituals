<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moon Rituals - Aloko Udapadi</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --gold: #D4AF37;
            --moon-yellow: #FFEE8C;
            --navy: #083A4F;
            --deep: #020E16;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body, #root {
            height: 100%;
            margin: 0; padding: 0;
        }

        body {
            background: #020E16;
            color: #E5E1DD;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100dvh;
        }

        body.modal-open { overflow: hidden; position: fixed; width: 100%; }

        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        .sinhala-text { font-family: 'Abhaya Libre', 'Sinhala Sangam MN', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── Canvas starfield ── */
        #star-canvas {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }

        /* ── Aurora background ── */
        .aurora {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            overflow: hidden;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            mix-blend-mode: screen;
            opacity: 0.18;
            animation: auroraDrift 20s ease-in-out infinite alternate;
        }
        .aurora-blob:nth-child(1) { width: 60vw; height: 60vw; background: #1a6b8a; top: -20%; left: -10%; animation-duration: 22s; }
        .aurora-blob:nth-child(2) { width: 50vw; height: 50vw; background: #0d3d5c; top: 30%; right: -15%; animation-duration: 18s; animation-delay: -8s; }
        .aurora-blob:nth-child(3) { width: 40vw; height: 40vw; background: #2a5c6a; bottom: -10%; left: 20%; animation-duration: 25s; animation-delay: -5s; }
        @keyframes auroraDrift {
            0%   { transform: translate(0,0) scale(1); }
            50%  { transform: translate(5vw, 3vh) scale(1.1); }
            100% { transform: translate(-3vw, 6vh) scale(0.95); }
        }

        /* ── Loader ── */
        #loader-css {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: #020E16; z-index: 9999; flex-direction: column; gap: 16px;
        }
        .loader-ring {
            width: 48px; height: 48px;
            border: 3px solid rgba(212,175,55,0.12);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Gold gradients ── */
        .title-gold {
            background: linear-gradient(135deg, #B8860B 0%, #D4AF37 30%, #FFEE8C 50%, #D4AF37 70%, #B8860B 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineGold 6s linear infinite;
        }
        .poya-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #F2D060 20%, #FFEE8C 40%, #FFFCCC 55%, #FFEE8C 70%, #F2D060 85%, #D4AF37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineGold 5s linear infinite;
            display: inline-block;
        }
        @keyframes shineGold { to { background-position: 200% center; } }

        /* ── Realistic Moon ── */
        .moon-wrap {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
        }
        .moon-glow-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,100% { opacity: 0.4; transform: scale(1); }
            50%      { opacity: 0.7; transform: scale(1.08); }
        }
        .moon-float { animation: moonFloat 5s ease-in-out infinite; }
        @keyframes moonFloat {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }
        .moon-shadow {
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(0,0,0,0.4) 0%, transparent 70%);
            filter: blur(6px);
            animation: shadowPulse 5s ease-in-out infinite;
        }
        @keyframes shadowPulse {
            0%,100% { transform: scaleX(1); opacity: 0.5; }
            50%      { transform: scaleX(0.8); opacity: 0.2; }
        }

        /* ── Glass cards ── */
        .glass-card {
            background: linear-gradient(135deg, rgba(8,58,79,0.82) 0%, rgba(4,28,44,0.90) 100%);
            border: 1px solid rgba(212,175,55,0.28);
            border-radius: 2rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 0 30px rgba(212,175,55,0.12), inset 0 1px 0 rgba(255,255,255,0.12);
            border-color: rgba(212,175,55,0.5);
        }

        /* Ivory cards (for accordions) */
        .ivory-card {
            background: linear-gradient(-45deg, #FFFFF0, #FFFFFF, #F8F4E3, #FFFCF0);
            background-size: 300% 300%;
            animation: ivoryFlow 10s ease-in-out infinite;
            border-radius: 2.1rem;
        }
        @keyframes ivoryFlow {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Spinning border conic ── */
        .spin-border {
            position: relative;
            border-radius: 2.2rem;
            overflow: hidden;
        }
        .spin-border::before {
            content: '';
            position: absolute;
            inset: -100%;
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                #D4AF37 10%, #FFEE8C 15%, #D4AF37 20%,
                transparent 30%, transparent 50%,
                #D4AF37 60%, #FFEE8C 65%, #D4AF37 70%,
                transparent 80%
            );
            animation: spinBorder 8s linear infinite;
            z-index: 0;
        }
        .spin-border > * { position: relative; z-index: 1; }
        @keyframes spinBorder { to { transform: rotate(360deg); } }

        /* ── Accordion ── */
        .accordion-body {
            max-height: 0; overflow: hidden;
            transition: max-height 0.8s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease;
            opacity: 0;
        }
        .accordion-body.open { max-height: 5000px; opacity: 1; }

        /* ── Page fade ── */
        .fade-up { animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }

        /* ── Month card stagger ── */
        .card-enter { opacity: 0; transform: translateY(20px) scale(0.97); }
        .card-enter-active { transition: opacity 0.5s ease, transform 0.5s ease; }

        /* ── Ripple ── */
        .ripple-btn {
            position: relative; overflow: hidden;
            cursor: pointer; user-select: none;
        }
        .ripple-btn .ripple-effect {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        /* ── Modal ── */
        @keyframes modalPop {
            0%   { opacity:0; transform:scale(0.88) translateY(32px); }
            100% { opacity:1; transform:scale(1) translateY(0); }
        }
        .modal-pop { animation: modalPop 0.45s cubic-bezier(0.2,1,0.3,1) forwards; }

        /* ── Toggle pill ── */
        .tab-pill {
            position: relative;
            display: flex; gap: 0;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 9999px;
            padding: 4px;
            backdrop-filter: blur(8px);
        }
        .tab-pill .tab-indicator {
            position: absolute; top: 4px; bottom: 4px;
            border-radius: 9999px;
            background: #083A4F;
            transition: left 0.3s cubic-bezier(0.4,0,0.2,1), width 0.3s ease;
            z-index: 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .tab-pill button { position: relative; z-index: 1; }

        /* ── Time badge ── */
        .time-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #083A4F 0%, #0d4f6e 100%);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 10px;
            padding: 6px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ── Intro devotional text ── */
        .devot-line { opacity: 0; transform: translateY(12px); animation: devLine 0.7s forwards; }
        @keyframes devLine { to { opacity:1; transform:translateY(0); } }

        /* ── Scrollbar in modals ── */
        .modal-scroll { scrollbar-width: thin; scrollbar-color: rgba(212,175,55,0.3) transparent; }
        .modal-scroll::-webkit-scrollbar { width: 4px; }
        .modal-scroll::-webkit-scrollbar-track { background: transparent; }
        .modal-scroll::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 2px; }

        /* ── Month selector modal ── */
        .month-btn-active {
            background: linear-gradient(135deg, #D4AF37, #FFEE8C) !important;
            color: #021017 !important;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(212,175,55,0.4);
        }

        /* Poya row hover */
        .poya-row {
            transition: background 0.2s, transform 0.2s;
            border-radius: 1rem;
        }
        .poya-row:hover { background: rgba(255,255,255,0.65); transform: translateX(4px); }
    </style>
</head>
<body>
<canvas id="star-canvas"></canvas>
<div class="aurora">
    <div class="aurora-blob"></div>
    <div class="aurora-blob"></div>
    <div class="aurora-blob"></div>
</div>

<div id="root">
    <div id="loader-css">
        <div class="loader-ring"></div>
        <p style="font-family:'Abhaya Libre',serif;color:rgba(212,175,55,0.6);font-size:14px;letter-spacing:0.2em;">LOADING</p>
    </div>
</div>

<script>
/* ── Starfield + Milky Way + Shooting Stars ── */
(function(){
    const c = document.getElementById('star-canvas');
    const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
    resize(); window.addEventListener('resize', resize);
    const ctx = c.getContext('2d');

    /* Regular drifting stars */
    const stars = Array.from({length:55}, () => ({
        x: Math.random(), y: Math.random(),
        r: Math.random() * 1.1 + 0.2,
        a: Math.random() * 0.7 + 0.2,
        da: (Math.random() - 0.5) * 0.003,
        vx: (Math.random() - 0.5) * 0.00006,
        vy: (Math.random() - 0.5) * 0.00006,
        gold: Math.random() < 0.12
    }));

    /* Milky Way micro-stars – diagonal band */
    const milky = Array.from({length:260}, () => {
        const t = Math.random();
        const spread = 0.18;
        return {
            x: 0.25 + t * 0.55 + (Math.random()-0.5)*spread,
            y: 0.05 + t * 0.65 + (Math.random()-0.5)*spread*0.7,
            r: Math.random() * 0.55 + 0.1,
            a: Math.random() * 0.55 + 0.12,
        };
    });

    /* Shooting stars */
    const shooters = [];
    let nextShot = 2500 + Math.random() * 3000;
    let last = 0;

    function spawnShooter(){
        const sx = 0.1 + Math.random() * 0.6;
        const sy = Math.random() * 0.35;
        const angle = Math.PI/4 + (Math.random()-0.5)*0.4;
        shooters.push({ x:sx, y:sy, angle, speed:0.0013+Math.random()*0.001,
            len:0.06+Math.random()*0.05, a:1 });
    }

    function drawMilkyWay(){
        /* Soft glow band */
        const bx0=0.25*c.width, by0=0.05*c.height, bx1=0.80*c.width, by1=0.70*c.height;
        const g = ctx.createLinearGradient(bx0,by0,bx1,by1);
        g.addColorStop(0,  'rgba(90,110,200,0)');
        g.addColorStop(0.25,'rgba(100,130,220,0.18)');
        g.addColorStop(0.5, 'rgba(130,155,240,0.28)');
        g.addColorStop(0.75,'rgba(100,130,220,0.18)');
        g.addColorStop(1,  'rgba(90,110,200,0)');
        ctx.save();
        ctx.fillStyle = g;
        ctx.fillRect(0,0,c.width,c.height);
        /* Micro stars */
        milky.forEach(s=>{
            ctx.globalAlpha = s.a;
            ctx.beginPath();
            ctx.arc(s.x*c.width, s.y*c.height, s.r, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(200,220,255,1)';
            ctx.fill();
        });
        ctx.restore();
    }

    function draw(ts){
        const dt = ts - last; last = ts;
        ctx.clearRect(0,0,c.width,c.height);

        drawMilkyWay();

        /* Drifting stars */
        stars.forEach(s => {
            s.a += s.da;
            if(s.a <= 0.15 || s.a >= 0.95){ s.da *= -1; }
            s.x += s.vx; s.y += s.vy;
            if(s.x<0) s.x=1; if(s.x>1) s.x=0;
            if(s.y<0) s.y=1; if(s.y>1) s.y=0;
            const px=s.x*c.width, py=s.y*c.height, rd=s.r*3;
            const grd = ctx.createRadialGradient(px,py,0,px,py,rd);
            grd.addColorStop(0, s.gold?'rgba(255,238,140,1)':'rgba(255,255,255,1)');
            grd.addColorStop(1, s.gold?'rgba(255,238,140,0)':'rgba(200,220,255,0)');
            ctx.save(); ctx.globalAlpha=s.a;
            ctx.beginPath(); ctx.arc(px,py,rd,0,Math.PI*2);
            ctx.fillStyle=grd; ctx.fill(); ctx.restore();
        });

        /* Shooting stars */
        nextShot -= dt;
        if(nextShot <= 0){ spawnShooter(); nextShot = 3500+Math.random()*4500; }
        for(let i=shooters.length-1;i>=0;i--){
            const s=shooters[i];
            s.x += Math.cos(s.angle)*s.speed;
            s.y += Math.sin(s.angle)*s.speed;
            s.a -= 0.015;
            if(s.a<=0||s.x>1.1||s.y>1.1){ shooters.splice(i,1); continue; }
            const tx=s.x-Math.cos(s.angle)*s.len, ty=s.y-Math.sin(s.angle)*s.len;
            const sg=ctx.createLinearGradient(tx*c.width,ty*c.height,s.x*c.width,s.y*c.height);
            sg.addColorStop(0,'rgba(255,255,255,0)');
            sg.addColorStop(0.6,'rgba(255,248,200,0.4)');
            sg.addColorStop(1,'rgba(255,255,255,0.95)');
            ctx.save(); ctx.globalAlpha=s.a;
            ctx.strokeStyle=sg; ctx.lineWidth=1.6;
            ctx.beginPath(); ctx.moveTo(tx*c.width,ty*c.height); ctx.lineTo(s.x*c.width,s.y*c.height);
            ctx.stroke();
            /* Head glow */
            const hg=ctx.createRadialGradient(s.x*c.width,s.y*c.height,0,s.x*c.width,s.y*c.height,4);
            hg.addColorStop(0,'rgba(255,255,240,0.9)'); hg.addColorStop(1,'rgba(255,255,240,0)');
            ctx.beginPath(); ctx.arc(s.x*c.width,s.y*c.height,4,0,Math.PI*2);
            ctx.fillStyle=hg; ctx.fill();
            ctx.restore();
        }
        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
})();
</script>

<script type="text/babel">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

const T = {
    deep: '#020E16', navy: '#083A4F', navyMid: '#104C66',
    gold: '#D4AF37', darkGold: '#B8860B', moonYellow: '#FFEE8C',
    copper: '#8B5E2F', sand: '#E5E1DD',
};

/* ── Ripple helper ── */
function addRipple(e) {
    const btn = e.currentTarget;
    const circle = document.createElement('span');
    const d = Math.max(btn.offsetWidth, btn.offsetHeight);
    const r = btn.getBoundingClientRect();
    circle.className = 'ripple-effect';
    circle.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
    btn.appendChild(circle);
    setTimeout(() => circle.remove(), 700);
}

/* ── Realistic Moon SVG ── */
function RealisticMoon({ phase = 'full', size = 72, glow = true }) {
    const id = useMemo(() => 'moon-' + Math.random().toString(36).slice(2), []);
    const craters = [
        { cx:32, cy:34, r:7  }, { cx:62, cy:52, r:9  },
        { cx:44, cy:68, r:5  }, { cx:24, cy:58, r:4  },
        { cx:68, cy:28, r:4.5}, { cx:55, cy:75, r:3.5},
        { cx:18, cy:40, r:3  }, { cx:72, cy:60, r:3  },
    ];

    let litPath = null;
    if (phase === 'full')        litPath = <circle cx="50" cy="50" r="47" fill={T.moonYellow} />;
    if (phase === 'waxing_q')    litPath = <path d="M50 3 A47 47 0 0 1 50 97 A23 47 0 0 0 50 3 Z" fill={T.moonYellow}/>;
    if (phase === 'waning_q')    litPath = <path d="M50 3 A47 47 0 0 0 50 97 A23 47 0 0 1 50 3 Z" fill={T.moonYellow}/>;

    return (
        <div className="moon-wrap" style={{width: size, alignItems:'center', position:'relative'}}>
            <svg viewBox="0 0 100 100" width={size} height={size} className="moon-float" style={{position:'relative',zIndex:1}}>
                <defs>
                    <radialGradient id={`${id}-base`} cx="40%" cy="35%" r="65%">
                        <stop offset="0%"   stopColor="#1a6b8a"/>
                        <stop offset="50%"  stopColor="#0d4460"/>
                        <stop offset="100%" stopColor="#041522"/>
                    </radialGradient>
                    <radialGradient id={`${id}-lit`} cx="38%" cy="32%" r="70%">
                        <stop offset="0%"   stopColor="#fff9d4"/>
                        <stop offset="40%"  stopColor={T.moonYellow}/>
                        <stop offset="100%" stopColor="#c9a820"/>
                    </radialGradient>
                    <radialGradient id={`${id}-highlight`} cx="30%" cy="25%" r="40%">
                        <stop offset="0%" stopColor="rgba(255,255,255,0.35)"/>
                        <stop offset="100%" stopColor="rgba(255,255,255,0)"/>
                    </radialGradient>
                    <filter id={`${id}-shadow`} x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
                        <feOffset dx="2" dy="3"/>
                        <feComposite in2="SourceGraphic" operator="over"/>
                    </filter>
                    <clipPath id={`${id}-clip`}><circle cx="50" cy="50" r="47"/></clipPath>
                </defs>

                {/* Base sphere */}
                <circle cx="50" cy="50" r="47" fill={`url(#${id}-base)`}/>

                {/* Lit phase */}
                {phase !== 'new' && (
                    <g clipPath={`url(#${id}-clip)`}>
                        {phase === 'full' && <circle cx="50" cy="50" r="47" fill={`url(#${id}-lit)`}/>}
                        {phase === 'waxing_q' && <path d="M50 3 A47 47 0 0 1 50 97 Q50 97 50 3 Z" fill={`url(#${id}-lit)`}/>}
                        {phase === 'waning_q' && <path d="M50 3 A47 47 0 0 0 50 97 Q50 97 50 3 Z" fill={`url(#${id}-lit)`}/>}
                    </g>
                )}

                {/* Craters (dark on light, light on dark) */}
                {craters.map((cr, i) => (
                    <circle key={i} cx={cr.cx} cy={cr.cy} r={cr.r}
                        fill={phase === 'new' ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.1)'}
                        clipPath={`url(#${id}-clip)`}
                    />
                ))}

                {/* Highlight shine */}
                <circle cx="50" cy="50" r="47" fill={`url(#${id}-highlight)`} clipPath={`url(#${id}-clip)`}/>

                {/* Rim */}
                <circle cx="50" cy="50" r="47" fill="none"
                    stroke={phase === 'new' ? 'rgba(212,175,55,0.2)' : 'rgba(255,238,140,0.4)'}
                    strokeWidth="0.8"/>
            </svg>
            {glow && phase !== 'new' && (
                <div style={{
                    width: `${size * 0.72}px`, height: `${size * 0.18}px`,
                    marginTop: `-${size * 0.06}px`,
                    background: 'radial-gradient(ellipse, rgba(255,238,140,0.65) 0%, rgba(255,228,100,0.2) 55%, transparent 75%)',
                    filter: `blur(${Math.max(3, size * 0.04)}px)`,
                    borderRadius: '50%',
                    pointerEvents: 'none',
                    flexShrink: 0,
                }}/>
            )}
            <div className="moon-shadow" style={{width: size*0.7, height: size*0.1, marginTop: glow && phase !== 'new' ? 2 : 6}}/>
        </div>
    );
}

function MoonIcon({ phase = 'full', size = 48 }) {
    return <RealisticMoon phase={phase} size={size} glow={phase !== 'new'}/>;
}

/* ── Sandglass icon ── */
const SandglassIcon = () => (
    <svg className="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2">
        <path d="M6 2H18M6 22H18M7 2V6.5C7 8.5 8.5 10 10.5 10.5L13.5 11.5C15.5 12 17 13.5 17 15.5V22M17 2V6.5C17 8.5 15.5 10 13.5 10.5L10.5 11.5C8.5 12 7 13.5 7 15.5V22" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
);

/* ── Poya Category Card ── */
function PoyaCategoryCard({ title, moonPhase, occurrences, isExpanded, onToggle }) {
    return (

/* ── Phase card ── */
function PhaseCard({ p, idx, selectedMonth, cleanNikini, sinhalaMonths, onDescClick }) {
    const [entered, setEntered] = useState(false);
    useEffect(() => {
        const t = setTimeout(() => setEntered(true), idx * 120);
        return () => clearTimeout(t);
    }, [idx]);

    return (
        <div className="w-full max-w-lg mb-5 glass-card overflow-hidden fade-up"
             style={{animationDelay: `${idx*0.1}s`, opacity: entered ? undefined : 0}}>
            <div className="p-6 md:p-7 flex items-center space-x-5">
                <div className="flex-shrink-0">
                    <MoonIcon phase={p.moonPhase} size={60}/>
                </div>
                <div className="flex-grow min-w-0">
                    <h3 className="text-2xl md:text-3xl font-bold poya-gold sinhala-text leading-tight">{p.title}</h3>
                    <p className="sinhala-text text-lg font-bold text-white/80 mt-1 leading-snug">{p.date}</p>
                    <div className="flex items-center gap-3 mt-3">
                        <div className="time-badge text-white">
                            <SandglassIcon/>
                            <span className="sinhala-text text-base font-bold">{p.time}</span>
                        </div>
                    </div>
                    {p.description && (
                        <span onClick={onDescClick} style={{
                            display:'inline-block', marginTop:'10px', cursor:'pointer',
                            fontFamily:"'Abhaya Libre',serif", fontSize:'17px', fontWeight:'700',
                            color:'#FFEE8C', textDecoration:'underline',
                            textDecorationColor:'rgba(255,238,140,0.4)', textUnderlineOffset:'3px',
                        }}>
                            පෝය විස්තරය
                        </span>
                    )}
                </div>
            </div>
        </div>
    );
}

                { title:"පුර පසළොස්වක පෝය", date:"බක් මස 21 වන බදාදා දින",      time:"පූර්ව භාග 3:57", moonPhase:'full',    description: sinhalaMonths[11].desc },
                { title:"අව අටවක පෝය",      date:"බක් මස 29 වන බ්‍රහස්පතින්දා දින",time:"පූර්ව භාග 1:47",moonPhase:'waning_q' },
            ],
        };
        return phases[id] || [];
    };

    const changeMonth = (dir) => {
        setSelectedMonth(m => {
            const next = Math.max(0, Math.min(11, m + dir));
            if (next !== m) setMonthKey(k => k+1);
            return next;
        });
    };

    /* ── INTRO ── */
    if (appState === 'intro') {
        return (
            <div style={{height:'100vh',width:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',position:'relative',zIndex:10,overflow:'hidden',padding:'0 16px',boxSizing:'border-box'}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',width:'100%',maxWidth:'28rem'}}>

                    <div style={{marginBottom:'5px', flexShrink:0}}>
                        <RealisticMoon phase="full" size={96} glow={true}/>
                    </div>

                    <div style={{marginBottom:'20px', flexShrink:0}}>
                        <h1 className="text-4xl font-semibold tracking-[0.15em] serif title-gold uppercase leading-none">
                            MOON<br/>RITUALS
                        </h1>
                    </div>

                    <div className="sinhala-text text-white/80 text-center" style={{lineHeight:1.48, fontSize:'clamp(17.5px,5vw,22.5px)', marginBottom:'20px'}}>
                        {[
                            "සිත් සනහන සඳ මඬල,",
                            "පිවිතුරුවූත්, බලවත්වූත් ශක්තියක්",
                            "අපගේ ජීවිතයන්ට ලබා දෙයි.",
                            "",
                            "සඳ මඬලේ සඳ රැස් ශක්තිය සමග,",
                            "ඔබගේ ජීවිතය නන් අයුරින් සශ්‍රීක කරවන",
                            "ලෞකික හා ලෝකෝත්තර",
                            "පූජනීය වතාවත්",
                            "සිදු කළ හැකි වේ.",
                            "",
                            "තෙරැවන් සරණයි!",
                        ].map((line, i) => (
                            <span key={i} className="devot-line block" style={{animationDelay:`${0.5 + i*0.08}s`, marginBottom: line === '' ? '0.45em' : '0'}}>
                                {line || ' '}
                            </span>
                        ))}
                    </div>

                    <button
                        onClick={(e) => { addRipple(e); setTimeout(() => setAppState('main'), 200); }}
                        className="ripple-btn sinhala-text font-bold transition-all active:scale-95"
                        style={{
                            flexShrink: 0,
                            marginBottom: '8px',
                            padding: '9px 36px',
                            borderRadius: '999px',
                            fontSize: '16px',
                            background: 'rgba(8,50,70,0.7)',
                            backdropFilter: 'blur(12px)',
                            border: '1px solid rgba(212,175,55,0.55)',
                            color: T.gold,
                            boxShadow: '0 4px 18px rgba(0,0,0,0.45), 0 0 12px rgba(212,175,55,0.12)',
                            letterSpacing: '0.06em',
                        }}
                    >
                        පිවිසෙන්න
                    </button>

                    <footer className="opacity-25 text-[10px] tracking-widest uppercase text-white serif">
                        © Three Vidya Insight Center
                    </footer>
                </div>
            </div>
        );
    }

    /* ── MAIN ── */
    const m = sinhalaMonths[selectedMonth];
    const phases = getMoonPhasesForMonth(selectedMonth);

    return (
    <React.Fragment>
        <main className="flex-1 relative w-full flex flex-col items-center py-10 md:py-16 fade-up min-h-screen" style={{zIndex:1}}>

            {/* Header */}
            <header className="z-10 text-center mb-8 px-4">
                <h1 className="text-4xl md:text-6xl font-semibold tracking-[0.15em] serif title-gold uppercase leading-none mb-8">
                    MOON<br/>RITUALS
                </h1>

                {/* Tab switcher */}
                <div className="tab-pill inline-flex mt-2">
                    <div className="tab-indicator" style={{
                        left: viewMode === 'month' ? '4px' : 'calc(50% + 0px)',
                        width: 'calc(50% - 4px)',
                    }}/>
                    <button onClick={() => setViewMode('month')}
                        className={`w-36 py-2.5 sinhala-text text-lg rounded-full transition-colors ${viewMode==='month' ? 'text-[#D4AF37] font-bold' : 'text-white font-medium'}`}>
                        මාසය
                    </button>
                    <button onClick={() => setViewMode('poya')}
                        className={`w-36 py-2.5 sinhala-text text-lg rounded-full transition-colors ${viewMode==='poya' ? 'text-[#D4AF37] font-bold' : 'text-white font-medium'}`}>
                        පොහොය
                    </button>
                </div>
            </header>

            {/* Month view */}
            {viewMode === 'month' ? (
                <div className="w-full max-w-5xl px-4 flex flex-col items-center">
                    {/* Month navigator */}
                    <div className="flex items-center space-x-5 mb-8 w-full max-w-lg justify-center">
                        <button disabled={selectedMonth === 0}
                            className="w-10 h-10 flex items-center justify-center text-white/60 hover:text-white disabled:opacity-20 transition-all active:scale-90"
                            onClick={(e) => { changeMonth(-1); }}>
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </button>

                        <div className="text-center flex-1 cursor-pointer group" onClick={() => setIsMonthOpen(true)}>
                            <div className="flex items-center justify-center space-x-1.5">
                                <h2 className="sinhala-text text-3xl md:text-4xl font-bold text-white group-hover:text-[#FFEE8C] transition-colors">
                                    {m.id === 3 ? cleanNikini : m.name} මාසය
                                </h2>
                                <svg className="w-4 h-4 text-white/30 group-hover:text-[#FFEE8C] transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" strokeWidth={2} strokeLinecap="round"/></svg>
                            </div>
                            <p className="text-xs tracking-widest text-white/60 serif uppercase mt-0.5">{m.year} · {m.en}</p>
                        </div>

                        <button disabled={selectedMonth === 11}
                            className="w-10 h-10 flex items-center justify-center text-white/60 hover:text-white disabled:opacity-20 transition-all active:scale-90"
                            onClick={(e) => { changeMonth(1); }}>
                            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"/></svg>
                        </button>
                    </div>

                    {/* Phase progress strip */}
                    <div className="flex items-center justify-center space-x-4 mb-8 opacity-60">
                        {['new','waxing_q','full','waning_q'].map((ph, i) => (
                            <React.Fragment key={ph}>
                                <MoonIcon phase={ph} size={28}/>
                                {i < 3 && <div className="w-6 h-px bg-white/20"/>}
                            </React.Fragment>
                        ))}
                    </div>

                    {/* Phase cards */}
                    <div key={monthKey} className="w-full flex flex-col items-center">
                        {phases.map((p, i) => (
                            <PhaseCard key={i} p={p} idx={i}
                                selectedMonth={selectedMonth}
                                cleanNikini={cleanNikini}
                                sinhalaMonths={sinhalaMonths}
                                onDescClick={() => setPoyaModal({ isOpen: true, data: { monthName: m.id===3 ? cleanNikini : m.name, description: p.description } })}
                            />
                        ))}
                    </div>
                </div>
            ) : (
                <div className="w-full max-w-5xl px-4 flex flex-col items-center">
                    {/* Phase guide — matches month view strip */}
                    <div className="flex items-center justify-center space-x-4 mb-6 opacity-70">
                        {['new','waxing_q','full','waning_q'].map((ph, i) => (
                            <React.Fragment key={ph}>
                                <MoonIcon phase={ph} size={30}/>
                                {i < 3 && <div className="w-5 h-px bg-white/20"/>}
                            </React.Fragment>
                        ))}
                    </div>
                    {poyaCategories.map(cat => (
                        <PoyaCategoryCard key={cat.id}
                            title={cat.title}
                            moonPhase={cat.moonPhase}
                            isExpanded={expandedPoyaType === cat.id}
                            onToggle={() => setExpandedPoyaType(expandedPoyaType === cat.id ? null : cat.id)}
                            occurrences={getPoyaData(cat.id)}
                        />
                    ))}
                </div>
            )}

            <footer className="z-10 mt-12 mb-6 opacity-20 text-[10px] tracking-widest uppercase text-white serif">
                © Three Vidya Insight Center
            </footer>
        </main>

        {/* ── Poya description modal ── */}
        {poyaModal.isOpen && (
            <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px',background:'rgba(2,10,18,0.95)',backdropFilter:'blur(16px)'}}
                 onClick={() => setPoyaModal({isOpen:false,data:null})}>
                <div className="modal-pop w-full max-w-md rounded-[2rem] overflow-hidden shadow-2xl"
                     style={{border:'1px solid rgba(212,175,55,0.3)', maxHeight:'85vh', display:'flex', flexDirection:'column',
                             background:'linear-gradient(160deg,#0D3348 0%,#071A26 60%,#030F18 100%)'}}
                     onClick={e => e.stopPropagation()}>
                    {/* Header */}
                    <div className="p-6 pb-4 flex-shrink-0" style={{borderBottom:'1px solid rgba(212,175,55,0.12)'}}>
                        <div className="flex items-center justify-between mb-1">
                            <div>
                                <p className="sinhala-text text-sm text-white/40 uppercase tracking-widest mb-1">පොහොය විස්තරය</p>
                                <h3 className="sinhala-text text-2xl font-bold leading-tight poya-gold">
                                    {poyaModal.data?.monthName} මස
                                </h3>
                            </div>
                            <button onClick={() => setPoyaModal({isOpen:false,data:null})}
                                className="w-9 h-9 rounded-full flex items-center justify-center transition-all"
                                style={{background:'rgba(255,255,255,0.06)',border:'1px solid rgba(255,255,255,0.1)',color:'rgba(255,255,255,0.5)'}}>
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" strokeWidth={2}/></svg>
                            </button>
                        </div>
                    </div>
                    {/* Body */}
                    <div className="p-6 overflow-y-auto modal-scroll flex-1">
                        <p className="sinhala-text text-[18px] leading-[1.85] text-justify whitespace-pre-line"
                           style={{color:'rgba(229,225,221,0.9)'}}>
                            {poyaModal.data?.description}
                        </p>
                    </div>
                </div>
            </div>
        )}
        {/* ── Month picker modal ── */}
        {isMonthOpen && (
            <div style={{position:'fixed',inset:0,zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px',background:'rgba(2,14,22,0.92)',backdropFilter:'blur(12px)'}}
                 onClick={() => setIsMonthOpen(false)}>
                <div className="modal-pop w-full max-w-xs rounded-3xl overflow-hidden shadow-2xl"
                     style={{background:'linear-gradient(135deg,#0A2330,#061820)',border:'1px solid rgba(255,255,255,0.08)',maxHeight:'80vh',display:'flex',flexDirection:'column'}}
                     onClick={e => e.stopPropagation()}>
                    <div className="p-5 flex-shrink-0" style={{borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
                        <h3 className="sinhala-text text-xl font-bold text-white text-center">මාසය තෝරන්න</h3>
                    </div>
                    <div className="p-3 overflow-y-auto no-scrollbar flex-1">
                        {sinhalaMonths.map(mo => (
                            <button key={mo.id}
                                className="ripple-btn w-full py-3.5 mb-1 rounded-xl sinhala-text text-lg transition-all"
                                style={selectedMonth===mo.id
                                    ? {background:'linear-gradient(135deg,#D4AF37,#FFEE8C)',color:'#021017',fontWeight:700,boxShadow:'0 4px 16px rgba(212,175,55,0.35)'}
                                    : {background:'transparent',color:'rgba(255,255,255,0.7)'}}
                                onClick={(e)=>{ addRipple(e); setSelectedMonth(mo.id); setMonthKey(k=>k+1); setIsMonthOpen(false); }}>
                                {mo.id===3 ? cleanNikini : mo.name} මස
                                <span className="ml-2 text-sm opacity-40 serif">{mo.year}</span>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
        )}
    </React.Fragment>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
